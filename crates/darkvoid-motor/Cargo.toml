[package]
name = "darkvoid-motor"
description = "Motor DARKVOID: processo auxiliar do editor do DarkFlow (prévia, reprodução, exportação e legendas) sobre o motor do FilmCraft"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "darkvoid-motor"
path = "src/main.rs"

[dependencies]
filmcraft-engine = { workspace = true, features = ["whisper", "speech-download"] }
filmcraft-speech = { workspace = true, features = ["whisper", "download"] }
serde = { workspace = true }
serde_json = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-edit = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-captions = { workspace = true }
filmcraft-text = { workspace = true }
cpal = "0.16"
crossbeam-queue = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake", "connect"] }
futures-util = { version = "0.3", features = ["sink"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "wgsl"] }
pollster = "1"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
filmcraft-platform = { workspace = true }
